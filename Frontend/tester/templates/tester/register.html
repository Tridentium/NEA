{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1>Register Page</h1>
    <h2>Links:</h2>
    <div>
    <a href = "{% url 'tester:login' %}">Login</a>
    </div>
    <form action="{% url 'tester:registeraccount' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <fieldset>
  
      
      <!-- Create First Name Input -->
      <label>First Name: </label>
      <input type="text" name="Firstname" placeholder="Username">
      <br><br>

      <!-- Create Last Name Input -->
      <label>Last Name: </label>
      <input type="text" name="Lastname" placeholder="Username">
      <br><br>

      <!-- Create Username Input -->
      <label>Username: </label>
      <input type="text" name="Username" placeholder="Username">
      <br><br>
      
      <!-- Create Email Input -->
      <label>Email: </label>
      <input type="text" name="Email" placeholder="Email">
      <br><br>

      <!-- Create Confirm Email Input -->
      <label>Confirm Email: </label>
      <input type="text" name="ConfirmEmail" placeholder="Email">
      <br><br>

      <!-- Create Confirm Email Input -->
      <label>Password: </label>
      <input type="password" name="Password" placeholder  ="Password">
      <br><br>

      <!-- Create Confirm Email Input -->
      <label>Confirm Password: </label>
      <input type="password" name="ConfirmPassword" placeholder="Password">
      <br><br>

      <!-- Create Class Input -->
      <label>Class: </label>
      <input type="text" name="Class" placeholder="Class">
      <br><br>

      <!-- Create Submit Entry Button -->
      <div>

      <p id = "ErrorMessage">{{ ErrorMessage }}</p>
      <br><br>
      <input type="submit" value="Register">
      </div>
    </form>
  </body>
</html>
