{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1>Profile Page</h1>
    <h2>Test page:</h2>
    <div id = "links">
    <a href = "{% url 'tester:index' %}">Index</a>
    <a href = "{% url 'tester:login' %}">Login</a>
    </div>
    <div>
    <hr>
    <vr>
    <p>Username: {{ user_name }}</p>
    <hr>
    <p>Email: {{ email }}</p>
    <hr>
    <p>Class: {{ class }}</p>
    <hr>
    </vr>
    </div>

    <script>
        if ("{{ teacherclass }}" != ""){
          const datalink = document.createElement("a");
          datalink.href = "{% url 'tester:studentdata' %}";
          datalink.textContent = "Class Data: {{ teacherclass }}";
          document.getElementById("links").appendChild(datalink);
        }
    </script>
  </body>
</html>
