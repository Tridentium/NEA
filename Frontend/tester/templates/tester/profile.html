{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>

    
    <br>
    <h1>Profile</h1>
    <br>


    <div id = "links">
      <a href = "{% url 'tester:index' %}"><button class = "pagenavigation">Homepage</button></a>
      <a href = "{% url 'tester:login' %}"><button class = "pagenavigation">Login</button></a>
    </div>
    <br><br><br>
    <div>
    <h2>Username: {{ user_name }}</h2>
    <h2>Email: {{ email }}</h2>
    <h2>Class: {{ class }}</h2>
    </div>
    <br><br>
    <form action="{% url 'tester:logoutaccount' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <input type="submit" value="Logout">
      </div>
    </form>
    <script>
        if ("{{ teacherclass }}" != ""){
          const datalink = document.createElement("a");
          datalink.href = "{% url 'tester:studentdata' %}";
          datalink.id = "createdlink"
          const databutton = document.createElement("button");
          databutton.textContent = "Class Data: {{ teacherclass }}";
          databutton.className = "pagenavigation";
          document.getElementById("links").appendChild(datalink);
          document.getElementById("createdlink").appendChild(databutton)
        }
    </script>
  </body>
</html>
