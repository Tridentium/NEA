{% load static %}
<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <br>
    <h1>Question {{ currentQuestionNo }}</h1>
    <div>
    <br>
    <a href = "{% url 'tester:login' %}"><button class = "pagenavigation">Login</button></a>
    <a href = "{% url 'tester:testsettings' %}"><button class = "pagenavigation">New Test</button></a>
    <br><br><br><br>
    
    <div id = "svg">{{ image|safe }}</div>
    <br> 
    <!-- <strong> {{ molecule_name }} </strong> -->
    </div>
    

    <form action="{% url 'tester:answerquestion' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <!-- Create Answer Input -->
      <input type="text" name="Answer" placeholder="Answer">
      <br><br>
      <!-- Create Submit Entry Button -->
      <div>
      <br><br>
      <input type="submit" value="Submit">
      </div>
    </form>
   
  </body>
</html>
