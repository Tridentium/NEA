{% load static %}
<link rel="stylesheet" href="{% static 'tester/question.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1>Question Page</h1>
    <h2>Links:</h2>
    <div>
    <a href = "{% url 'tester:answer' %}">Answer</a>
    <br>
    <a href = "{% url 'tester:login' %}">Login</a>
    <br>
    <a href = "{% url 'tester:testsettings' %}">Test Settings</a>
    <br><br><br><br>
    <div>{{ image|safe }}</div>
    <br><br><br>  
    <strong> {{ molecule_name }} </strong>
    </div>
    

    <form action="{% url 'tester:answerquestion' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <fieldset>

      <!-- Create Answer Input -->
      <input type="text" name="Answer" value="Answer">
      <br><br>
      <!-- Create Submit Entry Button -->
      <div>
      <br><br>
      <input type="submit" value="Submit">
      </div>
    </form>
   
  </body>
</html>
