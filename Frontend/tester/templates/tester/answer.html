{% load static %}

<link rel="stylesheet" href="{% static 'tester/answer.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1 id="Outcome">Answer Outcome</h1>
    <h2>Test page:</h2>
    <div>
    <a href = "{% url 'tester:login' %}">Login</a>
    <a href = "{% url 'tester:testsettings' %}">Test Settings</a>
    </div>
    <div>
    <h2>Actual answer:</h2>
    <br>
    {{ svg|safe }}
    <br>
    <p id = "nameForPrinting">{{nameForPrinting}}</p>
    <h2>Your answer:</h2>
    <p id = "user_answer">{{ user_answer }}</p>
    </div>

    <script>
      if (document.getElementById("user_answer").innerHTML.toLowerCase() == document.getElementById("nameForPrinting").innerHTML.toLocaleLowerCase()) {
        document.getElementById("Outcome").innerHTML = "Correct";
      }
      else{
        document.getElementById("Outcome").innerHTML = "Incorrect";
      }
    </script>
        <form action="{% url 'tester:newquestion' %}" method="post">
          {% csrf_token %}
          <fieldset>
          <br><br>
          <input type="submit" value="New Question">
          </div>
          </fieldset>
        </form>
  </body>
</html>
