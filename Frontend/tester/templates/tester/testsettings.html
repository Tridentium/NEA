{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <!-- Page title -->
    <h1>Test Settings</h1>

    <!-- Define form -->
    <form action="{% url 'tester:settestsettings' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <fieldset>
      <br><br>
      <!-- Create Molecule Length Slider -->
      <div>
      <input type="range" name="MolLength" id="MolLength" min = "2" max = "10" value = 5 step = 1 list = "markers">
      <label>Maximum molecule length slider: <output id="value"></output></label><br>

      <!-- Add graduations to the slider -->
      <datalist id="markers">
        <option value="2"></option>
        <option value="3"></option>
        <option value="4"></option>
        <option value="5"></option>
        <option value="6"></option>
        <option value="7"></option>
        <option value="8"></option>
        <option value="9"></option>
        <option value="10"></option>
      </datalist>

      <!-- Update the displayed value of the slider -->
      <script>
        const value = document.querySelector("#value");
        const input = document.querySelector("#MolLength");
        value.textContent = input.value;
        input.addEventListener("input", (event) => {
          value.textContent = event.target.value;
        });
      </script>
      </div>

      <br><br><br>
      <!-- Create Functional Group Radio Options -->
      <div>
        <h2>Select Desired Functional Groups: </h2>
        <br>
        <input type="checkbox" name="FuncGroup[]" id="alkane" value = "alkane">
        <label>Alkane</label>

        <input type="checkbox" name="FuncGroup[]" id="alkene" value = "alkene">
        <label>Alkene</label>

        <input type="checkbox" name="FuncGroup[]" id="alcohol" value = "alcohol">
        <label>Alcohol</label>

        <input type="checkbox" name="FuncGroup[]" id="amine" value = "amine">
        <label>Amine</label>
        
        <input type="checkbox" name="FuncGroup[]" id="ketone" value = "ketone">
        <label>Ketone</label>

        <br>


        <input type="checkbox" name="FuncGroup[]" id="carboxylicacid" value = "carboxylicacid">
        <label>Carboxylic Acid</label>

        <input type="checkbox" name="FuncGroup[]" id="aldehyde" value = "aldehyde">
        <label>Aldehyde</label>

        <input type="checkbox" name="FuncGroup[]" id="acylchloride" value = "acylchloride">
        <label>Acyl Chloride</label>

        <input type="checkbox" name="FuncGroup[]" id="amide" value = "amide">
        <label>Amide</label>
      </div>

      <br><br><br>
      <!-- Create test length slider -->
      <div>
        <input type="range" name="TestLength" id="TestLength" min = "1" max = "50" value = 10 step = 1 list = "length_markers">
        <label>Number of questions in test: <output id="length_value"></output></label><br>
  
        <!-- Add graduations to the slider -->
        <datalist id="length_markers">
          <option value="1"></option>
          <option value="10"></option>
          <option value="20"></option>
          <option value="30"></option>
          <option value="40"></option>
          <option value="50"></option>
        </datalist>
  
        <!-- Update the displayed value of the slider -->
        <script>
          const length_value = document.querySelector("#length_value");
          const length_input = document.querySelector("#TestLength");
          length_value.textContent = length_input.value;
          length_input.addEventListener("input", (event) => {
            length_value.textContent = event.target.value;
          });
        </script>
      </div>

      <br>
      <p class = "error">{{ errormessage }}</p>

      <!-- Create Submit Entry Button -->
      <div>
      <br><br>
      <input type="submit" value="Submit">
      </div>
    </form>
  </body>
</html>
