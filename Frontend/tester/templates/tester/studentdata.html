{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1>Student Data Page</h1>
    <h2>Test page:</h2>
    <div>
    <a href = "{% url 'tester:index' %}">Index</a>
    <a href = "{% url 'tester:login' %}">Login</a>
    </div>
    <div id = "classinputform">

    </div>

    <div id = "studentnamesform">
    <form action="{% url 'tester:getstudentdatafromstudenname' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <fieldset>
      <div id = "studentnamebuttons">


      </div>
    </form>

    <ul id = "outputlist">

    </ul>

    </div>

    <script>
      if ("{{ studentnames }}"){
        studentnames = "{{ studentnames }}".split(/\s*,\s*/);
        for (let index = 0; index < studentnames.length; index++) {
          const newButton = document.createElement('input');
          newButton.type = "submit";
          newButton.value = studentnames[index];
          newButton.name = "studentname";
          document.getElementById("studentnamebuttons").appendChild(newButton);
        }

        questionresultsarray = "{{ requestedstudentdata }}".split(", ");
        for (let index = 0; index < questionresultsarray.length; index++) {
          if (questionresultsarray[index] == "0"){
            questionresultsarray[index] = "Incorrect";
          }
          else if (questionresultsarray[index] == "1"){
            questionresultsarray[index] = "Correct";
          }
        } 
        for (let index = 0; index < questionresultsarray.length; index = index + 2) {
          const newListItem = document.createElement('li');
          newListItem.textContent = questionresultsarray[index + 1] + ": " + questionresultsarray[index];
          document.getElementById("outputlist").appendChild(newListItem);

        }
         
      }
      else {
        // document.getElementById("studentnamesform").remove()
      }
    </script>
  </body>
</html>
