{% load static %}

<link rel="stylesheet" href="{% static 'tester/login.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <h1>Login Page</h1>
    <h2>Links:</h2>
    <div>
    <a href = "{% url 'tester:index' %}">Index</a>
    <a href = "{% url 'tester:register' %}">register</a>
    </div>

    <form action="{% url 'tester:loginaccount' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br>
      <fieldset>
      <label>Username: </label>
      <!-- Create Username Input -->
      <input type="text" name="Username" value="Username">
      <br><br>
      <label>Password: </label>
      <!-- Create Password Input -->
      <input type="password" name="Password" value="Password">
      <br><br>
      <!-- Create Submit Entry Button -->
      <div>

      <p id = "ErrorMessage">{{ ErrorMessage }}</p>
      <br><br>
      <input type="submit" value="Login">
      </div>
    </form>
  </body>
</html>
