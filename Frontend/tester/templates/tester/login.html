{% load static %}

<link rel="stylesheet" href="{% static 'tester/general.css' %}">
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My test page</title>
  </head>
  <body>
    <br>
    <h1>Login Page</h1>
    <br>
    
    <div>
    <a href = "{% url 'tester:index' %}"><button class = "pagenavigation">Homepage</button></a>
    <a href = "{% url 'tester:register' %}"><button class = "pagenavigation">Register</button></a>
    </div>

    <form action="{% url 'tester:loginaccount' %}" method="post">

      <!-- Implements Django's protections against Cross Site Request Forgeries -->
      {% csrf_token %}

      <br><br><br><br><br>
      <label>Username: </label>
      <!-- Create Username Input -->
      <input type="text" name="Username" placeholder="Username">
      <br><br>
      <label>Password: </label>
      <!-- Create Password Input -->
      <input type="password" name="Password" placeholder="Password">
      <br><br>
      <!-- Create Submit Entry Button -->
      <div>

      <p id = "ErrorMessage" class = "error">{{ ErrorMessage }}</p>
      <br><br>
      <input type="submit" value="Login">
      </div>
    </form>
  </body>
</html>
